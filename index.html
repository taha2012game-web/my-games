<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة Moto X3M Pool Party</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      padding: 15px 0;
    }
    h1 {
      font-size: 1.5rem;
      color: #38bdf8;
      margin-bottom: 5px;
    }
    .game-container {
      width: 100%;
      max-width: 900px;
      height: 80vh;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚴‍♂️ لعبة Moto X3M Pool Party</h1>
  </header>

  <main class="game-container">
    <iframe 
      src="https://play.famobi.com/moto-x3m-pool-party" 
      allowfullscreen>
    </iframe>
  </main>

</body>
</html>
